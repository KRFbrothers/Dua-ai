<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dua — Color mode</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Roboto,Arial,sans-serif;background:#141218}.phone{--bg:#141218;--surface:#211f26;--text:#e6e0e9;--secondary:#cac4d0;--accent:#d0bcff;--on-accent:#381e72;--selected:#4a4458;background:var(--bg);color:var(--text);width:100%;max-width:390px;min-height:100dvh;padding:16px;margin:auto;color-scheme:dark}.phone:has(#light:checked){--bg:#fef7ff;--surface:#f3edf7;--text:#1d1b20;--secondary:#49454f;--accent:#6750a4;--on-accent:#fff;--selected:#e8def8;color-scheme:light}@media(prefers-color-scheme:light){.phone:has(#system:checked){--bg:#fef7ff;--surface:#f3edf7;--text:#1d1b20;--secondary:#49454f;--accent:#6750a4;--on-accent:#fff;--selected:#e8def8;color-scheme:light}}a{text-decoration:none;color:inherit}.header{height:48px;display:flex;align-items:center;justify-content:space-between;margin-bottom:32px}.header h1{font-size:18px;font-weight:400;margin:0}.icon{height:48px;width:48px;background:var(--surface);color:var(--secondary);border-radius:50%;display:grid;place-items:center;font-size:24px}.options{border:0;padding:8px;margin:0;background:var(--surface);border-radius:16px}.options legend{float:left;width:100%;padding:8px 12px 12px;font-size:14px;color:var(--secondary)}.row{clear:both;display:flex;align-items:center;gap:16px;min-height:72px;padding:12px;cursor:pointer;border-radius:12px}.row input{height:24px;width:24px;margin:0;accent-color:var(--accent);flex:none}.row:has(input:checked){background:var(--selected)}.row strong{font-size:16px;font-weight:400}.row small{display:block;margin-top:4px;font-size:14px;color:var(--secondary);line-height:1.4}.note{font-size:14px;line-height:1.5;color:var(--secondary);margin:16px 8px 28px}.preview{padding:20px;background:var(--surface);border-radius:20px}.preview h2{font-size:18px;font-weight:400;margin:0 0 16px}.bubble{background:var(--selected);padding:16px;border-radius:16px;font-size:16px;line-height:1.5}.button{min-height:48px;border:0;border-radius:24px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;margin-top:20px;font-size:14px}input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
</style></head><body><main class="phone"><header class="header"><a class="icon" href="settings.html" aria-label="Back to settings design">‹</a><h1>Color mode</h1><span style="width:48px"></span></header><fieldset class="options"><legend>Choose appearance</legend><label class="row"><input type="radio" name="theme" id="dark" checked><span><strong>Dark</strong><small>Dua’s default appearance</small></span></label><label class="row"><input type="radio" name="theme" id="light"><span><strong>Light</strong><small>A brighter appearance</small></span></label><label class="row"><input type="radio" name="theme" id="system"><span><strong>System</strong><small>Follow your device’s color mode</small></span></label></fieldset><p class="note">This changes only the design preview. Your app settings stay unchanged.</p><section class="preview"><h2>I am Dua</h2><div class="bubble">Hello! How can I help you today?</div><a class="button" href="chat.html">Back to chat preview</a></section></main><script>

if(new URLSearchParams(location.search).get('from')==='voice'){
 document.querySelectorAll('a[href]').forEach(link=>{const target=link.getAttribute('href');if(['settings.html', 'profile.html', 'data-controls.html', 'permissions.html', 'color-mode.html', 'font-style.html', 'notifications.html', 'logout.html', 'computer-mode.html', 'voice-permission.html', 'voice-permission-denied.html'].includes(target)){link.setAttribute('href',target+'?from=voice');}});
