<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dua — Loading preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#141218;display:flex;justify-content:center;min-height:100svh;font-family:Roboto,Arial,sans-serif}.mobile{width:100%;max-width:390px;min-height:100svh;display:flex;align-items:center}.mobile svg{display:block;width:100%;height:auto}#assistant-loading-bubble circle{animation:thinking 1.2s ease-in-out infinite}#assistant-loading-bubble circle:nth-of-type(2){animation-delay:.2s}#assistant-loading-bubble circle:nth-of-type(3){animation-delay:.4s}@keyframes thinking{0%,80%,100%{opacity:.35}40%{opacity:1}}@media(prefers-reduced-motion:reduce){#assistant-loading-bubble circle{animation:none}}
</style></head><body><main class="mobile" aria-label="Dua chat loading design preview"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="390" height="844" viewBox="0 0 390 844">
  <title>Dua — Chat Loading</title>
  <desc>Static loading-state reference shared by web and Android. Composer is cleared after sending; Stop replaces Send and no API call or animation runs in this SVG. 390 by 844 mobile interface. Material Design 3 dark colors; editable text and vector controls. Original Dua logo embedded as PNG. No browser chrome or phone frame.</desc>
  <defs>
    <style>text{font-family:Roboto,Arial,sans-serif} .icon{fill:none;stroke:#cac4d0;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}</style>
  </defs>
  <rect id="background" width="390" height="844" fill="#141218"/>
  <g id="chat-header">
    <circle cx="40" cy="40" r="24" fill="#211f26"/>
    <path fill="none" stroke="#cac4d0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M44 32 36 40 44 48M36 40H51"/>
    <text x="195" y="46" text-anchor="middle" fill="#e6e0e9" font-size="18" font-weight="500" font-family="Roboto, Arial, sans-serif">I am Dua</text>
    <circle cx="350" cy="40" r="24" fill="#211f26"/>
    <g fill="none" stroke="#cac4d0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="339" y="30" width="22" height="17" rx="1"/><path d="M350 47v7M344 54h12"/></g>
  </g>
  
  <g id="loading-conversation">
  <rect x="314" y="116" width="56" height="56" rx="20" fill="#4a4458"/>
  <text x="342" y="150" text-anchor="middle" font-family="Roboto, Arial, sans-serif" fill="#e6e0e9" font-size="16">Hi</text>
  <g id="assistant-loading-bubble">
    <rect x="24" y="190" width="242" height="62" rx="20" fill="#211f26"/>
    <text x="42" y="227" font-family="Roboto, Arial, sans-serif" font-size="16" fill="#cac4d0">Dua is thinking…</text>
    <circle cx="220" cy="222" r="3" fill="#d0bcff" opacity=".45"/>
    <circle cx="232" cy="222" r="3" fill="#d0bcff" opacity=".7"/>
    <circle cx="244" cy="222" r="3" fill="#d0bcff"/>
  </g>
</g>
<g id="composer">
    <rect x="16" y="684" width="358" height="144" rx="28" fill="#211f26"/>
    <text x="36" y="727" fill="#cac4d0" font-size="20" letter-spacing=".1" font-family="Roboto, Arial, sans-serif">Ask anything…</text>
    <g id="attach-button">
      <circle cx="60" cy="784" r="24" fill="#36343b"/>
      <path fill="none" stroke="#cac4d0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M60 770v28M46 784h28"/>
    </g>
    <g id="model-button">
      <rect x="92" y="764" width="88" height="40" rx="20" fill="#4a4458"/>
      <text x="136" y="789" text-anchor="middle" fill="#e8def8" font-size="14" font-weight="500" font-family="Roboto, Arial, sans-serif">Model</text>
    </g>
    <g id="microphone">
      <rect x="252" y="769" width="12" height="22" rx="6" fill="#cac4d0"/>
      <path fill="none" stroke="#cac4d0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M248 784v3a10 10 0 0 0 20 0v-3M258 797v7M250 804h16"/>
    </g>
<g id="stop-button" role="img" aria-label="Stop response">
  <rect x="306" y="760" width="48" height="48" rx="16" fill="#d0bcff"/>
  <rect x="322" y="776" width="16" height="16" rx="2" fill="#381e72"/>
</g>
  </g>
</svg>
</main></body></html>
