<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content"><title>Dua — Keyboard typing</title><style>
*{box-sizing:border-box}body{margin:0;background:#141218;color:#e6e0e9;font-family:Roboto,Arial,sans-serif;display:flex;justify-content:center}.phone{width:100%;max-width:390px;height:100dvh;max-height:844px;display:flex;flex-direction:column}.header{height:80px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:16px}.header h1{font-size:18px;font-weight:400}.icon{width:48px;height:48px;border:0;border-radius:50%;background:#211f26;color:#cac4d0;display:grid;place-items:center;cursor:pointer}svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.messages{flex:1;min-height:32px}.composer{margin:0 16px 16px;padding:16px;background:#211f26;border-radius:28px;flex:none}textarea{display:block;width:100%;height:44px;resize:none;border:0;outline:0;background:transparent;color:#e6e0e9;font:20px Roboto,Arial,sans-serif}textarea::placeholder{color:#cac4d0}.tools{display:flex;align-items:center;gap:8px;margin-top:12px}.plus{background:#36343b}.model{height:48px;min-width:88px;border:0;border-radius:24px;background:#4a4458;color:#e6e0e9;font-size:14px}.mic{margin-left:auto;background:transparent}.send{border-radius:16px;background:#d0bcff;color:#381e72}.keyboard{background:#211f26;padding:12px 5px 20px;flex:none}.keys{display:flex;justify-content:center;gap:5px;margin-bottom:7px}.key{height:42px;flex:1;max-width:35px;border:0;border-radius:7px;background:#36343b;color:#e6e0e9;font-size:16px}.wide{max-width:none;flex:1.6}.space{max-width:none;flex:5}.hint{font-size:12px;color:#cac4d0;text-align:center;margin:0 0 12px}@media(max-height:600px){.keyboard{display:none}.phone{max-height:none}}button:focus-visible{outline:2px solid #d0bcff;outline-offset:2px}
</style></head><body><main class="phone"><header class="header"><a class="icon" href="state-chat-response.html" aria-label="Back"><svg viewBox="0 0 24 24"><path d="m14 5-7 7 7 7M7 12h14"/></svg></a><h1>I am Dua</h1><button class="icon" aria-label="Computer mode unavailable" disabled><svg viewBox="0 0 24 24"><path d="M3 3h18v14H3zM12 17v4m-5 0h10"/></svg></button></header><section class="messages" aria-label="Conversation"></section><form class="composer"><textarea aria-label="Message" placeholder="Ask anything…">Hi</textarea><div class="tools"><button type="button" class="icon plus" aria-label="Attachments unavailable" disabled><svg viewBox="0 0 24 24"><path d="M12 2v20M2 12h20"/></svg></button><button type="button" class="model" disabled>Model</button><button type="button" class="icon mic" aria-label="Microphone unavailable" disabled><svg viewBox="0 0 24 24"><rect x="8" y="2" width="8" height="13" rx="4"/><path d="M4 11v2a8 8 0 0 0 16 0v-2M12 21v-1m-4 3h8"/></svg></button><button class="icon send" aria-label="Send message"><svg viewBox="0 0 24 24"><path d="M12 21V3m-7 7 7-7 7 7"/></svg></button></div></form><section class="keyboard" aria-label="Illustrative keyboard"><p class="hint">Typing preview</p><div class="keys" data-keys="qwertyuiop"></div><div class="keys" data-keys="asdfghjkl"></div><div class="keys" data-keys="zxcvbnm"></div><div class="keys"><button class="key wide" type="button" data-action="clear">Clear</button><button class="key space" type="button" data-action="space">space</button><button class="key wide" type="button" data-action="delete">⌫</button></div></section></main><script>
const input=document.querySelector('textarea'),send=document.querySelector('.send');function update(){const ready=input.value.trim().length>0;send.setAttribute('aria-label',ready?'Send message':'Open voice preview');send.innerHTML=ready?'<svg viewBox="0 0 24 24"><path d="M12 21V3m-7 7 7-7 7 7"/></svg>':'<svg viewBox="0 0 24 24"><path d="m12 2 9 5v10l-9 5-9-5V7zm0 10v10M3 7l9 5 9-5"/></svg>';send.style.background=ready?'#d0bcff':'#4a4458';send.style.color=ready?'#381e72':'#cac4d0'}input.addEventListener('input',update);document.querySelectorAll('[data-keys]').forEach(row=>{for(const char of row.dataset.keys){const key=document.createElement('button');key.className='key';key.type='button';key.textContent=char;key.onclick=()=>{input.value+=char;update()};row.appendChild(key)}});document.querySelectorAll('[data-action]').forEach(key=>key.onclick=()=>{input.value=key.dataset.action==='clear'?'':key.dataset.action==='delete'?input.value.slice(0,-1):input.value+' ';update()});document.querySelector('form').onsubmit=event=>{event.preventDefault();if(input.value.trim()){input.value='';update();location.href='state-chat-loading.html'}};update();
</script></body></html>
