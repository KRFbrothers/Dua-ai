<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dua — Memory</title><script src="app-settings.js"></script><link rel="stylesheet" href="app-settings.css"></head><body><main class="local-page" data-page="memory"><header class="local-header"><a href="settings.html" aria-label="Back to settings">‹</a><h1>Memory</h1><span style="width:48px"></span></header><label class="local-row"><input id="memory-enabled" type="checkbox">Use local memory in replies</label><p class="local-note">Save preferences you want Dua to use. Off by default. When enabled, these notes are sent to Gemini with each new prompt. Stored only in this browser; chats do not automatically create memories.</p><textarea class="local-input" id="memory-note" maxlength="200" aria-label="New memory" placeholder="For example: Reply in Hindi"></textarea><button class="local-button" id="memory-add">Save note</button><div id="memory-list"></div><button class="local-button" id="memory-clear">Delete all memories</button><p class="local-status" role="status" aria-live="polite"></p></main><script src="local-settings-page.js"></script></body></html>
