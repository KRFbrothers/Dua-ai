<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0a0a">
<title>Add to chat – Dua</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23333333' stroke='%23aaaaaa' d='M16 2 30 10v15L16 32 2 25V10Z M2 10l14 8 14-8 M16 18v14'/%3E%3C/svg%3E">
<link rel="stylesheet" href="shared.css">
<style>
.add-screen{width:100%;height:100dvh;background:var(--surface);padding:10px 16px 24px;overflow:auto;border-radius:28px 28px 0 0;max-width:760px;margin:auto}
.add-handle{width:44px;height:4px;background:var(--surface-highest);border-radius:4px;margin:0 auto 24px}
.add-header{position:relative;display:flex;align-items:center;justify-content:center;height:48px;margin-bottom:28px}
.add-header h1{font-size:24px;line-height:32px;font-weight:500;margin:0}
.add-close{position:absolute;left:0;background:transparent}
.upload-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
.upload-card{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;min-height:144px;padding:18px 8px;border:0;border-radius:24px;background:var(--surface-container);color:var(--on-surface);font-size:18px;line-height:24px;cursor:pointer}
.add-icon{width:52px;height:52px;flex-shrink:0;border-radius:50%;background:var(--surface-highest);display:grid;place-items:center}
.add-icon svg{width:26px;height:26px;fill:none;stroke:var(--on-surface-variant);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.add-group{border-radius:24px;background:var(--surface-container);overflow:hidden;margin-bottom:16px}
.add-row{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border:0;background:transparent;color:var(--on-surface);text-align:left;min-height:80px}
.add-row+.add-row{border-top:1px solid var(--surface-highest)}
.add-copy{display:flex;flex-direction:column;gap:5px;flex:1;font-size:20px;line-height:26px}
.add-copy small{font-size:16px;line-height:22px;color:var(--on-surface-variant)}
.add-chevron{width:20px;height:20px;fill:none;stroke:var(--outline);stroke-width:1.8}
.add-row .m3-switch{margin-left:auto}
.upload-card:focus-within{outline:2px solid var(--primary);outline-offset:3px}
.add-screen .selection-status{font-size:14px;line-height:20px;color:var(--on-surface-variant);margin:16px 4px}
@media(max-width:360px){.upload-card{font-size:16px;min-height:124px}.add-copy{font-size:18px}.add-row{padding:12px;gap:12px}}
.add-screen{max-width:480px;padding:16px 16px max(24px,env(safe-area-inset-bottom));border-radius:0}.add-handle{width:40px;margin-bottom:16px}.add-header{margin-bottom:24px;height:48px}.add-header h1{font-size:22px;line-height:28px}.add-close{width:48px;height:48px}.upload-grid{gap:12px;margin-bottom:20px}.upload-card{min-height:120px;border-radius:20px;padding:16px 8px;gap:12px;font-size:16px;line-height:24px}.add-icon{width:48px;height:48px}.add-icon svg{width:24px;height:24px}.add-group{border-radius:20px;margin-bottom:12px}.add-row{min-height:72px;padding:12px 16px;gap:12px}.add-copy{font-size:16px;line-height:24px;gap:4px;min-width:0}.add-copy small{font-size:14px;line-height:20px}.selection-status{padding:12px 16px;background:var(--surface-container);border-radius:16px;overflow-wrap:anywhere}.selection-status:empty{display:none}.upload-card:focus-visible{outline:2px solid var(--primary);outline-offset:3px}@media(max-width:340px){.upload-grid{gap:8px}.upload-card{padding:12px 4px;min-height:112px}}@media(max-height:500px){.upload-card{min-height:104px}.add-header{margin-bottom:16px}}
.add-row .m3-switch:disabled{opacity:.45;cursor:default}.add-row:has(.add-copy small) .add-chevron{opacity:.45}</style>
</head>
<body><main class="add-screen"><div class="add-handle" aria-hidden="true"></div><header class="add-header"><a class="round add-close" href="chat.html" aria-label="Close Add to chat"><svg viewBox="0 0 24 24"><path d="m5 5 14 14M19 5 5 19"/></svg></a><h1>Add to chat</h1></header><div class="upload-grid"><label class="upload-card" tabindex="0" role="button" aria-label="Camera"><span class="add-icon" aria-hidden="true"><svg viewBox="0 0 28 28"><path d="M4 7h4l2-3h6l2 3h4v15H4z"/><circle cx="13" cy="14" r="5"/></svg></span><span>Camera</span><input class="attachment-input" type="file" hidden accept="image/jpeg,image/png,image/webp" capture="environment"></label><label class="upload-card" tabindex="0" role="button" aria-label="Photos"><span class="add-icon" aria-hidden="true"><svg viewBox="0 0 28 28"><rect x="3" y="3" width="21" height="21" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m4 21 7-8 5 5 4-5 4 5"/></svg></span><span>Photos</span><input class="attachment-input" type="file" hidden accept="image/jpeg,image/png,image/webp" multiple></label><label class="upload-card" tabindex="0" role="button" aria-label="Files"><span class="add-icon" aria-hidden="true"><svg viewBox="0 0 28 28"><path d="M7 2h10l5 5v18H7zM17 2v6h5M14 21V11m-4 4 4-4 4 4"/></svg></span><span>Files</span><input class="attachment-input" type="file" hidden accept="image/jpeg,image/png,image/webp,application/pdf,text/plain,.txt" multiple></label></div><div class="add-group"><div class="add-row"><span class="add-icon" aria-hidden="true"><svg viewBox="0 0 28 28"><path d="M7 4h14M5 8h18M4 12h20l-2 13H6z"/></svg></span><span class="add-copy">Add to project<small>Coming soon</small></span><svg class="add-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></div></div><div class="add-group"><div class="add-row"><span class="add-icon" aria-hidden="true"><svg viewBox="0 0 28 28"><circle cx="14" cy="14" r="11"/><ellipse cx="14" cy="14" rx="5" ry="11"/><path d="M3 14h22"/></svg></span><span class="add-copy">Web search<small>Coming soon</small></span><button type="button" class="m3-switch" role="switch" aria-label="Web search coming soon" aria-checked="false" disabled><span></span></button></div><div class="add-row"><span class="add-icon" aria-hidden="true"><svg viewBox="0 0 28 28"><path d="m10 17 8-8a4 4 0 0 1 6 6L13 26a7 7 0 0 1-10-10L15 4a3 3 0 0 1 5 5L9 20a1.5 1.5 0 0 1-2-2l9-9"/></svg></span><span class="add-copy">Connectors<small>Coming soon</small></span><svg class="add-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></div><div class="add-row"><span class="add-icon" aria-hidden="true"><svg viewBox="0 0 28 28"><path d="M4 10a11 11 0 1 1 0 9M4 3v7h7M7 17l3-3 3 4 3-4 3 3"/></svg></span><span class="add-copy">Memory<small>Coming soon</small></span><button type="button" class="m3-switch" role="switch" aria-label="Memory coming soon" aria-checked="false" disabled><span></span></button></div></div><p style="font-size:14px;color:var(--on-surface-variant)">JPEG/PNG/WebP, PDF or TXT · Up to 3 files, 2 MB total; TXT 64 KB. Files go to Gemini with your next message only.</p><p class="selection-status" role="status" aria-live="polite"></p></main><script src="attachments.js"></script><script>document.querySelectorAll('.m3-switch').forEach(toggle=>toggle.addEventListener('click',()=>toggle.setAttribute('aria-checked',String(toggle.getAttribute('aria-checked')!=='true'))));
document.querySelectorAll('.upload-card').forEach(card=>card.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();card.querySelector('input').click()}}));
document.querySelectorAll('.attachment-input').forEach(input=>input.addEventListener('change',async()=>{
 const status=document.querySelector('.selection-status');status.textContent='Reading files…';
 try{const files=await DuaAttachments.read(Array.from(input.files));sessionStorage.setItem('dua-attachments',JSON.stringify(files));status.textContent=files.map(file=>file.name).join(', ')+' · Ready to send with your next message';}
 catch(error){status.textContent=error.message;input.value='';}
}));</script></body></html>
