<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0a0a">
<title>Add to chat – Dua</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23333333' stroke='%23aaaaaa' d='M16 2 30 10v15L16 32 2 25V10Z M2 10l14 8 14-8 M16 18v14'/%3E%3C/svg%3E">
<style>
:root{color-scheme:dark;--surface:#141218;--surface-container:#211f26;--surface-high:#2b2930;--surface-highest:#36343b;--on-surface:#e6e0e9;--on-surface-variant:#cac4d0;--primary:#d0bcff;--on-primary:#381e72;--secondary-container:#4a4458;--on-secondary-container:#e8def8;--outline:#938f99}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--surface);color:var(--on-surface);font-family:Roboto,"Segoe UI",Arial,sans-serif}
body{overflow:hidden}
.screen{width:100%;height:100dvh;min-height:360px;position:relative;overflow:hidden;background:var(--surface)}
.topbar{position:absolute;inset:20px 20px auto;display:flex;justify-content:space-between;align-items:center}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .18s,box-shadow .18s,transform .18s;position:relative;overflow:hidden}
.round{width:48px;height:48px;border:0;border-radius:50%;display:grid;place-items:center;padding:0;background:var(--surface-container)}
.round svg{width:24px;height:24px;fill:none;stroke:var(--on-surface-variant);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.topbar .round:last-child{background:var(--secondary-container);border-radius:16px;width:56px;height:56px;box-shadow:0 2px 6px #0003}
.topbar .round:last-child svg{stroke:var(--on-secondary-container)}
.empty{position:absolute;left:0;right:0;top:41%;transform:translateY(-50%);text-align:center;pointer-events:none}
.center-logo{display:block;width:156px;height:273px;object-fit:contain;margin:0 auto;mix-blend-mode:screen}
.composer{position:absolute;left:16px;right:16px;bottom:max(16px,env(safe-area-inset-bottom));height:144px;border:0;border-radius:28px;background:var(--surface-container);padding:20px;box-shadow:0 3px 12px #0002}
.composer:focus-within{box-shadow:0 0 0 1px var(--outline),0 3px 12px #0002}
.composer textarea{width:100%;height:36px;padding:0;margin:0;resize:none;border:0;outline:0;background:transparent;color:var(--on-surface);font:400 20px/28px Roboto,"Segoe UI",Arial,sans-serif;letter-spacing:.1px}
.composer textarea::placeholder{color:var(--on-surface-variant);opacity:1}
.controls{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
.control-group{display:flex;align-items:center;gap:8px}
.controls .round{background:var(--surface-highest);width:48px;height:48px}
.model{height:40px;min-width:88px;padding:0 20px;background:var(--secondary-container);color:var(--on-secondary-container);border:0;border-radius:20px;font-size:14px;font-weight:500;letter-spacing:.1px}
.controls .mic{background:transparent}
.mic svg{width:26px;height:31px}
.mic svg rect{fill:var(--on-surface-variant)}
.mic svg path{stroke:var(--on-surface-variant)}
.controls .send{background:var(--primary);border-radius:16px;box-shadow:0 2px 4px #0002}
.controls .send svg{stroke:var(--on-primary)}
button:hover{filter:brightness(1.12)}
button:active{transform:scale(.94)}
button:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
@media(min-width:700px){.topbar{inset:24px 28px auto}.composer{max-width:760px;width:calc(100% - 48px);left:50%;right:auto;transform:translateX(-50%);bottom:28px}}
@media(max-height:600px){.center-logo{width:91px;height:161px}}
@media(max-height:440px){.empty{top:35%}.center-logo{width:62px;height:109px}.composer{height:120px;padding:12px 16px}.controls{margin-top:8px}}
@media(prefers-reduced-motion:reduce){button{transition:none}}

[hidden]{display:none!important}
.controls .send.voice-ready{background:var(--secondary-container)}
.action-cube{width:38px;height:38px;display:block}
.controls .send.listening{box-shadow:0 0 0 3px var(--primary);background:var(--secondary-container)}
.voice-status{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

.settings-drawer{position:fixed;inset:0 auto 0 0;margin:0;width:min(100%,400px);max-width:100%;height:100dvh;max-height:100dvh;padding:0;border:0;border-radius:0 28px 28px 0;background:var(--surface);color:var(--on-surface);box-shadow:6px 0 24px #0004;overflow:hidden}
.settings-shell:not([open]) .settings-drawer,.settings-shell:not([open]) .settings-backdrop{display:none}.settings-shell[open] .settings-drawer{display:flex;flex-direction:column}
.settings-drawer::backdrop{background:#0009}
.settings-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;flex-shrink:0}
.settings-header .round{background:transparent;width:40px;height:40px}
.settings-header h2{font-size:20px;font-weight:400;line-height:28px;margin:0}
.info-icon{width:24px;height:24px;fill:none;stroke:var(--on-surface-variant);stroke-width:1.6;stroke-linecap:round;margin:8px}
.settings-content{padding:0 16px max(20px,env(safe-area-inset-bottom));overflow:auto;overscroll-behavior:contain}
.settings-group{border-radius:16px;background:var(--surface-container);overflow:hidden;margin:0 0 12px}
.setting-row{display:flex;align-items:center;gap:16px;min-height:52px;padding:10px 16px}
.setting-row:has(.setting-description){min-height:64px}
.setting-row+.setting-row{border-top:1px solid var(--surface-highest)}
.setting-icon{width:28px;height:28px;flex-shrink:0}
.setting-icon g{stroke:var(--on-surface-variant)}
.setting-icon circle[fill]{fill:var(--surface-container)}
.font-icon{font-size:22px;line-height:28px;color:var(--on-surface-variant)}
.setting-copy{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.setting-label{font-size:16px;line-height:22px;letter-spacing:.15px}
.setting-description{font-size:14px;line-height:18px;color:var(--on-surface-variant)}
.setting-chevron{width:20px;height:20px;fill:none;stroke:var(--on-surface-variant);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.logout-row{color:#ffb1c0}
.logout-row .setting-icon g,.logout-row .setting-chevron{stroke:#ffb1c0}
.m3-switch{width:44px;height:28px;flex-shrink:0;border-radius:16px;border:2px solid var(--outline);padding:0;background:var(--surface-highest);display:flex;align-items:center}
.m3-switch span{width:16px;height:16px;margin-left:4px;border-radius:50%;background:var(--outline);transition:transform .18s}
.m3-switch[aria-checked="true"]{background:var(--primary);border-color:var(--primary)}
.m3-switch[aria-checked="true"] span{width:20px;height:20px;margin-left:1px;background:var(--on-primary);transform:translateX(18px)}
@media(max-width:440px){.settings-drawer{width:100%;border-radius:0}}


.menu-space{width:48px;height:48px}
.settings-shell>summary{position:fixed;top:20px;left:20px;z-index:20;list-style:none}
.settings-shell>summary::-webkit-details-marker{display:none}
.settings-shell[open]>summary{top:12px;left:16px;width:40px;height:40px;z-index:102;background:transparent}
.settings-close-space{width:40px;height:40px;flex-shrink:0}
.settings-drawer{z-index:101}
.settings-backdrop{position:fixed;inset:0;background:#0009;z-index:100}
@media(min-width:700px){.settings-shell:not([open])>summary{top:24px;left:28px}}

.chat-list-view{flex:1;overflow:auto;padding:20px 16px}
.chat-list-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px}
.chat-list-actions{display:flex;gap:12px}
.profile-button{border:1px solid var(--outline);background:var(--surface-container)}
.chat-list-header .round{width:48px;height:48px}
.conversation-row{display:flex;align-items:center;gap:14px;width:100%;border:0;border-radius:20px;padding:12px 8px;background:transparent;text-align:left}
.conversation-row>img{width:48px;height:48px;flex-shrink:0}
.conversation-copy{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.conversation-title{font-size:18px;line-height:24px;font-weight:500}
.conversation-preview{font-size:16px;line-height:22px;color:var(--on-surface-variant)}
.conversation-time{font-size:12px;line-height:18px;color:var(--outline);align-self:flex-start;padding-top:2px}
.chat-search{margin-bottom:16px}
.chat-search input{width:100%;border:1px solid var(--outline);border-radius:24px;padding:12px 16px;background:var(--surface-container);color:var(--on-surface);font:inherit;outline-color:var(--primary)}
.profile-settings-view:not([hidden]){display:flex;flex-direction:column;min-height:0;flex:1}
.settings-shell[open]>summary{top:auto;bottom:20px;left:auto;right:20px;background:var(--surface-highest);width:40px;height:40px}
.settings-shell[open]>summary svg{display:none}
.settings-shell[open]>summary::after{content:'×';font-size:28px;line-height:1;color:var(--on-surface)}
@media(min-width:441px){.settings-shell[open]>summary{left:344px;right:auto}}
a{text-decoration:none;color:inherit}.round{cursor:pointer}.home-screen{width:100%;height:100dvh;padding:20px;overflow:auto}.home-screen .chat-list-header{margin-bottom:32px}.home-screen .conversation-row{max-width:900px}.home-screen .conversation-title{font-size:20px}.home-screen .conversation-time{font-size:14px}.standalone-settings{display:flex!important;flex-direction:column;height:100dvh;width:100%;max-width:700px;margin:auto}.home-link{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:var(--surface-container)}.home-link svg{width:24px;height:24px;fill:none;stroke:var(--on-surface-variant);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}@media(min-width:700px){.home-screen{padding:24px 28px}}

.add-screen{width:100%;height:100dvh;background:var(--surface);padding:10px 16px 24px;overflow:auto;border-radius:28px 28px 0 0;max-width:760px;margin:auto}
.add-handle{width:44px;height:4px;background:var(--surface-highest);border-radius:4px;margin:0 auto 24px}
.add-header{position:relative;display:flex;align-items:center;justify-content:center;height:48px;margin-bottom:28px}
.add-header h1{font-size:24px;line-height:32px;font-weight:500;margin:0}
.add-close{position:absolute;left:0;background:transparent}
.upload-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
.upload-card{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;min-height:144px;padding:18px 8px;border:0;border-radius:24px;background:var(--surface-container);color:var(--on-surface);font-size:18px;line-height:24px;cursor:pointer}
.add-icon{width:52px;height:52px;flex-shrink:0;border-radius:50%;background:var(--surface-highest);display:grid;place-items:center}
.add-icon svg{width:26px;height:26px;fill:none;stroke:var(--on-surface-variant);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.add-group{border-radius:24px;background:var(--surface-container);overflow:hidden;margin-bottom:16px}
.add-row{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border:0;background:transparent;color:var(--on-surface);text-align:left;min-height:80px}
.add-row+.add-row{border-top:1px solid var(--surface-highest)}
.add-copy{display:flex;flex-direction:column;gap:5px;flex:1;font-size:20px;line-height:26px}
.add-copy small{font-size:16px;line-height:22px;color:var(--on-surface-variant)}
.add-chevron{width:20px;height:20px;fill:none;stroke:var(--outline);stroke-width:1.8}
.add-row .m3-switch{margin-left:auto}
.upload-card:focus-within{outline:2px solid var(--primary);outline-offset:3px}
.add-screen .selection-status{font-size:14px;line-height:20px;color:var(--on-surface-variant);margin:16px 4px}
@media(max-width:360px){.upload-card{font-size:16px;min-height:124px}.add-copy{font-size:18px}.add-row{padding:12px;gap:12px}}
</style>
</head>
<body><main class="add-screen"><div class="add-handle" aria-hidden="true"></div><header class="add-header"><a class="round add-close" href="chat.html" aria-label="Close Add to chat"><svg viewBox="0 0 24 24"><path d="m5 5 14 14M19 5 5 19"/></svg></a><h1>Add to chat</h1></header><div class="upload-grid"><label class="upload-card" tabindex="0" role="button" aria-label="Camera"><span class="add-icon" aria-hidden="true"><svg viewBox="0 0 28 28"><path d="M4 7h4l2-3h6l2 3h4v15H4z"/><circle cx="13" cy="14" r="5"/></svg></span><span>Camera</span><input class="attachment-input" type="file" hidden accept="image/*" capture="environment"></label><label class="upload-card" tabindex="0" role="button" aria-label="Photos"><span class="add-icon" aria-hidden="true"><svg viewBox="0 0 28 28"><rect x="3" y="3" width="21" height="21" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m4 21 7-8 5 5 4-5 4 5"/></svg></span><span>Photos</span><input class="attachment-input" type="file" hidden accept="image/*" multiple></label><label class="upload-card" tabindex="0" role="button" aria-label="Files"><span class="add-icon" aria-hidden="true"><svg viewBox="0 0 28 28"><path d="M7 2h10l5 5v18H7zM17 2v6h5M14 21V11m-4 4 4-4 4 4"/></svg></span><span>Files</span><input class="attachment-input" type="file" hidden multiple></label></div><div class="add-group"><div class="add-row"><span class="add-icon" aria-hidden="true"><svg viewBox="0 0 28 28"><path d="M7 4h14M5 8h18M4 12h20l-2 13H6z"/></svg></span><span class="add-copy">Add to project<small>None</small></span><svg class="add-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></div></div><div class="add-group"><div class="add-row"><span class="add-icon" aria-hidden="true"><svg viewBox="0 0 28 28"><circle cx="14" cy="14" r="11"/><ellipse cx="14" cy="14" rx="5" ry="11"/><path d="M3 14h22"/></svg></span><span class="add-copy">Web search</span><button type="button" class="m3-switch" role="switch" aria-label="Web search" aria-checked="true"><span></span></button></div><div class="add-row"><span class="add-icon" aria-hidden="true"><svg viewBox="0 0 28 28"><path d="m10 17 8-8a4 4 0 0 1 6 6L13 26a7 7 0 0 1-10-10L15 4a3 3 0 0 1 5 5L9 20a1.5 1.5 0 0 1-2-2l9-9"/></svg></span><span class="add-copy">Connectors</span><svg class="add-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></div><div class="add-row"><span class="add-icon" aria-hidden="true"><svg viewBox="0 0 28 28"><path d="M4 10a11 11 0 1 1 0 9M4 3v7h7M7 17l3-3 3 4 3-4 3 3"/></svg></span><span class="add-copy">Memory</span><button type="button" class="m3-switch" role="switch" aria-label="Memory" aria-checked="true"><span></span></button></div></div><p class="selection-status" role="status" aria-live="polite"></p></main><script>document.querySelectorAll('.m3-switch').forEach(toggle=>toggle.addEventListener('click',()=>toggle.setAttribute('aria-checked',String(toggle.getAttribute('aria-checked')!=='true'))));
document.querySelectorAll('.upload-card').forEach(card=>card.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();card.querySelector('input').click()}}));
document.querySelectorAll('.attachment-input').forEach(input=>input.addEventListener('change',()=>{document.querySelector('.selection-status').textContent=Array.from(input.files,file=>file.name).join(', ')}));</script></body></html>
