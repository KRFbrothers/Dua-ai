.voice-topbar{height:48px;min-height:48px;flex:none;position:relative}.voice-topbar .round{width:48px;height:48px;background:var(--surface-container)}.voice-top-actions{gap:4px}.voice-title{position:absolute;left:50%;transform:translateX(-50%);font-size:18px;line-height:24px;font-weight:500;margin:0;pointer-events:none}.voice-preview-note{align-self:center;font-size:12px;line-height:18px;margin:16px 0 0;padding:5px 12px;border-radius:16px;background:var(--surface-container);color:var(--on-surface-variant);flex:none}
.voice-greeting{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;max-width:none;margin:28px 0 20px;padding:0 4px 16px}.voice-greeting>img{width:32px;height:32px;margin-bottom:20px}.voice-greeting p{font-size:24px;line-height:34px;margin:0 0 20px}.response-actions{gap:4px;flex-wrap:wrap}.response-actions .round{width:48px;height:48px}.response-actions .round svg{width:22px;height:22px}.voice-transcript{margin-top:16px;max-height:none;overflow:visible}
.voice-dock{flex:none;padding-top:12px;border-top:1px solid var(--surface-highest)}.voice-live-status{position:static;margin:0 0 16px;min-height:20px;font-size:14px;line-height:20px;text-align:center}.voice-bottom{position:static;display:grid;grid-template-columns:48px 48px minmax(64px,1fr) 48px 48px;gap:8px;align-items:center;left:auto;right:auto;bottom:auto}.voice-bottom .round{width:48px;height:48px}.voice-bottom .round:disabled{opacity:.45;cursor:default}.voice-capsule{width:100%;height:56px;margin:0;min-width:0;border-color:var(--outline);background:var(--surface-container)}#voice-mute[aria-pressed="false"]{background:var(--secondary-container);border-color:var(--primary)}#voice-mute[aria-pressed="false"] .voice-mic-slash{display:none}.voice-menu{top:72px;right:16px;z-index:5}
@media(max-height:500px){.voice-preview-note{margin-top:8px}.voice-greeting{margin:16px 0 12px}.voice-greeting p{font-size:20px;line-height:28px}.voice-greeting>img{margin-bottom:12px}.voice-live-status{margin-bottom:8px}.voice-dock{padding-top:8px}}a:focus-visible,button:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
.voice-menu{min-width:184px;padding:8px;border:1px solid var(--surface-highest);border-radius:20px;background:var(--surface-container);box-shadow:0 8px 24px #0005}.voice-menu a{display:flex;align-items:center;min-height:48px;padding:12px 16px;border-radius:12px;font-size:16px;line-height:24px}.voice-menu a:hover,.voice-menu a:focus-visible{background:var(--surface-highest)}.voice-menu[hidden]{display:none!important}.voice-notice{position:absolute;top:116px;left:24px;right:24px;text-align:center;font-size:14px;line-height:20px;color:var(--primary);pointer-events:none}.voice-greeting{margin-top:44px}@media(max-height:500px){.voice-notice{top:100px}.voice-greeting{margin-top:36px}}.voice-capsule{display:grid;place-items:center;perspective:240px}.voice-capsule::after{display:none}.voice-animated-cube{width:36px;height:36px;object-fit:contain;transform-origin:center;filter:drop-shadow(0 2px 4px #0004)}.voice-capsule[data-listening="true"] .voice-animated-cube{animation:dua-cube-listening 4s linear infinite;transform-style:preserve-3d;filter:drop-shadow(0 0 8px #d0bcff66)}@keyframes dua-cube-listening{0%{transform:rotateX(10deg) rotateY(0deg) scale(.96);opacity:.85}25%{transform:rotateX(14deg) rotateY(90deg) scale(1.04);opacity:1}50%{transform:rotateX(10deg) rotateY(180deg) scale(.96);opacity:.85}75%{transform:rotateX(6deg) rotateY(270deg) scale(1.04);opacity:1}100%{transform:rotateX(10deg) rotateY(360deg) scale(.96);opacity:.85}}@media(prefers-reduced-motion:reduce){.voice-capsule[data-listening="true"] .voice-animated-cube{animation:none}}
.voice-animated-cube{position:relative;width:24px;height:24px;transform-style:preserve-3d;transform:rotateX(-20deg) rotateY(32deg);filter:none}.cube-face{position:absolute;inset:0;border:1px solid var(--on-surface);background:linear-gradient(135deg,#c9c7cc,#77747d);backface-visibility:hidden}.cube-front{transform:translateZ(12px)}.cube-back{transform:rotateY(180deg) translateZ(12px)}.cube-right{transform:rotateY(90deg) translateZ(12px)}.cube-left{transform:rotateY(-90deg) translateZ(12px)}.cube-top{transform:rotateX(90deg) translateZ(12px);background:var(--on-surface)}.cube-bottom{transform:rotateX(-90deg) translateZ(12px);background:#68646e}.voice-capsule[data-listening="true"] .voice-animated-cube{filter:none}@media(prefers-reduced-motion:reduce){.voice-animated-cube{animation:none!important}}.voice-review{display:block;font-size:14px;line-height:20px;color:var(--on-surface-variant);margin-top:16px}.voice-review[hidden],.voice-use[hidden]{display:none}.voice-review textarea{display:block;width:100%;margin-top:8px;padding:12px;border:1px solid var(--outline);border-radius:16px;background:var(--surface-container);color:var(--on-surface);font:inherit;resize:vertical}.voice-use{min-height:48px;width:100%;margin-top:12px;border:0;border-radius:24px;background:var(--secondary-container);color:var(--on-surface);font:inherit}.voice-use:disabled{opacity:.45}

<body><main class="voice-screen"><header class="voice-topbar"><a class="round" href="settings.html?from=voice" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></a><h1 class="voice-title">Voice</h1><div class="voice-top-actions"><button type="button" class="round" aria-label="Camera off" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h12v10H4zM16 11l5-3v10l-5-3M3 3l18 18"/></svg></button><button type="button" class="round" id="voice-more" aria-label="More options" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button></div></header><p class="voice-preview-note">Voice input · Send and hear replies in Chat</p><div class="voice-menu" hidden><a href="chat.html">Back to chat</a><a href="settings.html?from=voice">Settings</a></div><div class="voice-notice" role="status" aria-live="polite"></div><section class="voice-greeting"><a class="local-button" href="hands-free.html" style="display:block;text-align:center;margin-bottom:16px">Hands-free conversation</a><img src="dua-cube.svg" alt="Dua"><p id="voice-greeting">Tap the microphone and speak. Review your words, then use them in Chat.</p><div class="response-actions"><button type="button" class="round feedback" aria-label="Like response" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10h4v11H3zM7 10l5-7c2 0 2 2 1 5h6c2 0 2 2 2 3l-2 8c0 1-1 2-3 2H7"/></svg></button><button type="button" class="round feedback" aria-label="Dislike response" aria-pressed="false" style="transform:rotate(180deg)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10h4v11H3zM7 10l5-7c2 0 2 2 1 5h6c2 0 2 2 2 3l-2 8c0 1-1 2-3 2H7"/></svg></button><button type="button" class="round" id="share-response" aria-label="Share response"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12v8h14v-8M12 16V3m-5 5 5-5 5 5"/></svg></button><button type="button" class="round" id="copy-response" aria-label="Copy response"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="7" width="12" height="14" rx="2"/><path d="M15 3H5a2 2 0 0 0-2 2v12"/></svg></button><button type="button" class="round" id="response-more" aria-label="More response options"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button></div><div class="voice-transcript" aria-live="polite"></div><label class="voice-review" hidden>Review transcript<textarea id="voice-draft" aria-label="Voice transcript" rows="4" maxlength="8000"></textarea></label><button type="button" class="voice-use" hidden disabled>Use in chat</button></section><footer class="voice-dock"><div class="voice-live-status" role="status">Muted · Tap mic to unmute</div><div class="voice-bottom"><button type="button" class="round" aria-label="Video unavailable" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h12v10H4zM16 11l5-3v10l-5-3M3 3l18 18"/></svg></button><button type="button" class="round" aria-label="Screen sharing unavailable" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 17V7m-4 4 4-4 4 4"/></svg></button><div class="voice-capsule" data-listening="false" aria-hidden="true"><div class="voice-animated-cube"><span class="cube-face cube-front"></span><span class="cube-face cube-back"></span><span class="cube-face cube-right"></span><span class="cube-face cube-left"></span><span class="cube-face cube-top"></span><span class="cube-face cube-bottom"></span></div></div><button type="button" class="round" id="voice-mute" aria-label="Unmute microphone" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11v2a7 7 0 0 0 14 0v-2M12 20v3M8 23h8"/><path class="voice-mic-slash" d="M3 3l18 18"/></svg></button><a class="round" href="chat.html" aria-label="Exit voice mode"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 5 14 14M19 5 5 19"/></svg></a></div></footer></main><script src="voice-input.js"></script><script>
const mute=document.querySelector('#voice-mute'), status=document.querySelector('.voice-live-status'), capsule=document.querySelector('.voice-capsule');
const review=document.querySelector('#voice-draft'), reviewLabel=document.querySelector('.voice-review'), use=document.querySelector('.voice-use');
const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
let finalTranscript='';let originChat=null;
try{originChat=JSON.parse(localStorage.getItem('dua-history-v2')||'null')?.activeId||null;}catch{}
const voice=new DuaVoiceInput(Recognition,state=>{
 mute.setAttribute('aria-pressed',String(!state.busy));mute.setAttribute('aria-label',state.busy?'Stop voice input':'Start voice input');
 capsule.dataset.listening=String(state.busy);status.textContent=state.status;
 document.querySelector('.voice-transcript').textContent=state.partial;
 if(state.transcript!==finalTranscript){finalTranscript=state.transcript;review.value=state.transcript;}
 reviewLabel.hidden=!state.transcript;use.hidden=!state.transcript;review.disabled=state.busy;use.disabled=state.busy||!review.value.trim();
},navigator.language);
mute.addEventListener('click',()=>voice.state.busy?voice.stop():voice.start());
review.addEventListener('input',()=>{use.disabled=voice.state.busy||!review.value.trim();});
use.addEventListener('click',()=>{
 if(voice.state.busy)return;
 try{
  const transcript=DuaVoiceDraft.merge('',review.value);
  sessionStorage.setItem('dua-voice-draft',JSON.stringify({text:transcript}));
  voice.stop();window.location.href='chat.html'+(originChat?'?chat='+encodeURIComponent(originChat):'');
 }catch(error){status.textContent=error.message;}
});
window.addEventListener('pagehide',()=>voice.stop());
document.addEventListener('visibilitychange',()=>{if(document.hidden&&voice.state.busy)voice.stop();});
const notice=document.querySelector('.voice-notice');let noticeTimer;function showNotice(text){notice.textContent=text;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>notice.textContent='',2400);}
const greeting=document.querySelector('#voice-greeting').textContent;
document.querySelector('#copy-response').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(review.value.trim()||greeting);showNotice('Copied');}catch(e){showNotice('Copy unavailable in this preview.');}});
document.querySelector('#share-response').addEventListener('click',async()=>{try{if(navigator.share){await navigator.share({text:review.value.trim()||greeting});showNotice('Shared');}else{await navigator.clipboard.writeText(review.value.trim()||greeting);showNotice('Copied for sharing');}}catch(e){if(e.name!=='AbortError')showNotice('Sharing unavailable in this preview.');}});
document.querySelectorAll('.feedback').forEach(button=>button.addEventListener('click',()=>{const selected=button.getAttribute('aria-pressed')==='true';document.querySelectorAll('.feedback').forEach(b=>b.setAttribute('aria-pressed','false'));button.setAttribute('aria-pressed',String(!selected));showNotice(selected?'Feedback removed':button.getAttribute('aria-label')==='Like response'?'Liked · Preview':'Disliked · Preview');}));
const more=document.querySelector('#voice-more'),responseMore=document.querySelector('#response-more'),menu=document.querySelector('.voice-menu');let menuSource=more;
menu.id='voice-options';for(const trigger of [more,responseMore]){trigger.setAttribute('aria-controls','voice-options');trigger.setAttribute('aria-expanded','false');}
function closeMenu(restoreFocus=false){menu.hidden=true;for(const trigger of [more,responseMore])trigger.setAttribute('aria-expanded','false');if(restoreFocus)menuSource.focus();}
function toggleMenu(trigger){if(!menu.hidden&&menuSource===trigger){closeMenu();return;}menuSource=trigger;menu.hidden=false;for(const button of [more,responseMore])button.setAttribute('aria-expanded',String(button===trigger));menu.querySelector('a')?.focus();}
for(const trigger of [more,responseMore])trigger.addEventListener('click',()=>toggleMenu(trigger));
document.addEventListener('click',event=>{if(!menu.hidden&&!menu.contains(event.target)&&!more.contains(event.target)&&!responseMore.contains(event.target))closeMenu();});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!menu.hidden){event.preventDefault();closeMenu(true);}});
document.addEventListener('focusin',event=>{if(!menu.hidden&&!menu.contains(event.target)&&event.target!==more&&event.target!==responseMore)closeMenu();});
</script></body></html>
