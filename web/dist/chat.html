<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0a0a">
<title>New chat</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23333333' stroke='%23aaaaaa' d='M16 2 30 10v15L16 32 2 25V10Z M2 10l14 8 14-8 M16 18v14'/%3E%3C/svg%3E">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="logo.css">
<style>
.topbar{gap:12px;justify-content:space-between}
.topbar>button{position:static;flex-shrink:0;margin-left:auto}
.home-link{flex-shrink:0}
.chat-header-title{position:absolute;left:50%;transform:translateX(-50%);max-width:calc(100% - 120px);font-size:18px;line-height:24px;font-weight:500;text-align:center}
@media(max-width:600px){.topbar{gap:8px;left:12px;right:12px}.topbar>button,.home-link{width:40px;height:40px}.chat-header-title{max-width:calc(100% - 104px);font-size:16px;line-height:22px}}

.model-picker>summary{list-style:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.model-picker>summary::-webkit-details-marker{display:none}
.model-close-label{display:none}
.model-picker:not([open]) .model-backdrop,.model-picker:not([open]) .model-sheet{display:none}
.model-backdrop{position:fixed;inset:0;background:#0009;z-index:200;cursor:pointer}
.model-sheet{position:fixed;bottom:0;left:0;right:0;max-width:640px;margin:auto;max-height:82dvh;background:var(--surface-container);border:1px solid var(--surface-highest);border-bottom:0;border-radius:28px 28px 0 0;z-index:201;padding:10px 16px 78px;overflow:auto;overscroll-behavior:contain;color:var(--on-surface);box-shadow:0 -6px 24px #0003}
.sheet-handle{width:44px;height:4px;background:var(--outline);border-radius:3px;margin:0 auto 24px}
.model-sheet-header{padding:0 8px 16px}
.model-sheet-header h2{font-size:22px;line-height:28px;font-weight:500;margin:0 0 8px}
.model-sheet-header p{font-size:14px;line-height:20px;color:var(--on-surface-variant);margin:0}
.model-options{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.model-option{position:relative;display:flex;align-items:center;gap:12px;min-height:66px;padding:10px 14px;border:1px solid transparent;border-radius:18px;cursor:pointer}
.model-option:has(input:checked){background:var(--surface-highest);border-color:var(--outline)}
.model-option:hover{background:var(--surface-high)}
.model-option input{position:absolute;width:1px;height:1px;opacity:0}
.model-option:has(input:focus-visible){outline:2px solid var(--primary);outline-offset:2px}
.provider-icon{width:40px;height:40px;flex-shrink:0;display:grid;place-items:center;border-radius:13px;background:var(--surface-high);font-size:18px;font-weight:600;color:var(--on-surface-variant)}
.model-option:has(input:checked) .provider-icon{background:var(--secondary-container);color:var(--on-secondary-container)}
.model-option-copy{display:flex;flex-direction:column;gap:4px;flex:1}
.model-option-name{font-size:16px;line-height:22px;font-weight:500}
.model-option-description{font-size:14px;line-height:18px;color:var(--on-surface-variant)}
.model-check{width:22px;height:22px;border-radius:50%;background:var(--primary);display:none;flex-shrink:0}
.model-check svg{width:22px;height:22px;fill:none;stroke:var(--on-primary);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.model-option:has(input:checked) .model-check{display:block}
.model-sheet-footer{font-size:12px;line-height:18px;color:var(--on-surface-variant);padding:24px 8px 0}
.model-picker[open]>summary{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));right:24px;z-index:202;min-width:80px;height:40px;box-shadow:0 2px 6px #0003}
.model-picker[open] .model-chip-label{display:none}
.model-picker[open] .model-close-label{display:block}
@media(min-width:700px){.model-picker[open]>summary{right:max(24px,calc((100vw - 640px)/2 + 24px))}}

.composer{transform:none;left:max(20px,calc((100% - 760px)/2))}
@media(max-width:699px){.composer{left:16px}}

.chat-messages{position:absolute;top:92px;bottom:210px;left:max(20px,calc((100% - 760px)/2));right:max(20px,calc((100% - 760px)/2));overflow:auto;display:flex;flex-direction:column;gap:18px;padding:12px 4px}
.chat-bubble{padding:14px 18px;border-radius:20px;max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px;line-height:25px;flex-shrink:0}
.chat-bubble.user{align-self:flex-end;background:var(--secondary-container);color:var(--on-secondary-container)}
.chat-bubble.assistant{align-self:flex-start;background:var(--surface-container)}
.chat-error{position:absolute;bottom:172px;left:20px;right:20px;text-align:center;margin:0;font-size:14px;line-height:20px;color:var(--on-surface-variant);max-height:calc(100dvh - 280px);overflow:auto;overflow-wrap:anywhere}
.model-option:has(input:disabled){opacity:.45;cursor:not-allowed}
</style>
</head>
<body>
<main class="screen" aria-label="New chat interface">
<nav class="topbar" aria-label="Chat controls">
<a class="home-link" href="index.html" aria-label="Back to home"><svg viewBox="0 0 24 24"><path d="m14 5-7 7 7 7M7 12h14"/></svg></a>
<button class="round" aria-label="Desktop view"><svg viewBox="0 0 32 32"><rect x="6" y="5" width="20" height="17" rx="1"/><path d="M16 22v5M10 27h12"/></svg></button>

<span class="chat-header-title">I am Dua</span></nav>
<section class="empty"><div class="center-logo" role="img" aria-label="DUA logo"></div></section>
<section class="chat-messages" aria-label="Conversation" aria-live="polite"></section><p class="chat-error" role="status"></p><form class="composer"><textarea aria-label="Message" placeholder="Ask anything..." rows="1"></textarea><div class="controls"><div class="control-group"><a class="round" aria-label="Add to chat" id="attach" href="add-to-chat.html"><svg viewBox="0 0 40 40"><path d="M20 7v26M7 20h26"/></svg></a><details class="model-picker"><summary class="model" aria-label="Choose a model"><span class="model-chip-label">Model</span><span class="model-close-label">Done</span></summary><div class="model-backdrop" aria-hidden="true"></div><section class="model-sheet" aria-labelledby="model-sheet-title"><div class="sheet-handle" aria-hidden="true"></div><header class="model-sheet-header"><h2 id="model-sheet-title">Choose a model</h2><p>Pick who responds in this chat</p></header><fieldset class="model-options"><legend class="voice-status">Available models</legend><label class="model-option"><input type="radio" name="chat-model" value="Dua" checked><span class="provider-icon" aria-hidden="true">D</span><span class="model-option-copy"><span class="model-option-name">Dua</span><span class="model-option-description">Default · Gemini</span></span><span class="model-check" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="m5 10 3 3 7-7"/></svg></span></label><label class="model-option"><input type="radio" name="chat-model" value="GPT"><span class="provider-icon" aria-hidden="true">G</span><span class="model-option-copy"><span class="model-option-name">GPT</span><span class="model-option-description">OpenAI · Placeholder</span></span><span class="model-check" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="m5 10 3 3 7-7"/></svg></span></label><label class="model-option"><input type="radio" name="chat-model" value="Gemini"><span class="provider-icon" aria-hidden="true">✦</span><span class="model-option-copy"><span class="model-option-name">Gemini</span><span class="model-option-description">Google · Gemini</span></span><span class="model-check" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="m5 10 3 3 7-7"/></svg></span></label><label class="model-option"><input type="radio" name="chat-model" value="Claude"><span class="provider-icon" aria-hidden="true">C</span><span class="model-option-copy"><span class="model-option-name">Claude</span><span class="model-option-description">Anthropic · Placeholder</span></span><span class="model-check" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="m5 10 3 3 7-7"/></svg></span></label><label class="model-option"><input type="radio" name="chat-model" value="Grok"><span class="provider-icon" aria-hidden="true">X</span><span class="model-option-copy"><span class="model-option-name">Grok</span><span class="model-option-description">xAI · Placeholder</span></span><span class="model-check" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="m5 10 3 3 7-7"/></svg></span></label><label class="model-option"><input type="radio" name="chat-model" value="Kimi"><span class="provider-icon" aria-hidden="true">K</span><span class="model-option-copy"><span class="model-option-name">Kimi</span><span class="model-option-description">Moonshot · Placeholder</span></span><span class="model-check" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="m5 10 3 3 7-7"/></svg></span></label></fieldset><footer class="model-sheet-footer">Gemini configuration check ho rahi hai…</footer></section></details></div><div class="control-group"><a class="round mic" aria-label="Open voice mode" href="voice.html"><svg viewBox="0 0 40 48" stroke="white" stroke-width="2.5" fill="none"><rect x="11" y="4" width="18" height="32" rx="9" fill="white" stroke="none"/><path d="M6 23v3a14 14 0 0 0 28 0v-3M20 40v7M9 47h22"/></svg></a><a class="round send voice-ready" aria-label="Start voice mode" id="composer-action" href="voice.html"><img class="action-cube" src="dua-cube.svg" alt=""><svg class="action-arrow" hidden viewBox="0 0 40 40"><path d="M20 33V7M9 18 20 7l11 11"/></svg></a></div></div></form>


</main>

<script>
const message = document.querySelector('textarea');
const action = document.querySelector('#composer-action');
const cube = action.querySelector('.action-cube');
const arrow = action.querySelector('.action-arrow');

function updateAction() {
  const hasText = message.value.trim().length > 0;
  cube.hidden = hasText;
  arrow.toggleAttribute('hidden', !hasText);
  action.classList.toggle('voice-ready', !hasText);

  const label = hasText ? 'Send message' : 'Start voice mode';
  action.setAttribute('aria-label', label);
  action.title = label;
}
message.addEventListener('input', () => {

  updateAction();
});
action.addEventListener('click', (event) => {
  if (!message.value.trim()) return;
  event.preventDefault();

  document.querySelector('.composer').requestSubmit();
});


updateAction();

const modelPicker = document.querySelector('.model-picker');
const modelSummary = modelPicker.querySelector('summary');
function closeModelPicker(){modelPicker.open=false;modelSummary.focus();}
modelPicker.querySelector('.model-backdrop').addEventListener('click',closeModelPicker);

modelPicker.querySelectorAll('input[name="chat-model"]').forEach(input=>input.addEventListener('change',()=>{
  document.querySelector('.model-chip-label').textContent=input.value;
  document.querySelector('.composer').dataset.model=input.value;
}));
document.addEventListener('keydown',event=>{
  if(!modelPicker.open)return;
  if(event.key==='Escape')closeModelPicker();
  if(event.key==='Tab'){
    const selected=modelPicker.querySelector('input:checked');
    if(document.activeElement===modelSummary){event.preventDefault();selected.focus();}
    else if(document.activeElement.name==='chat-model'){event.preventDefault();modelSummary.focus();}
  }
});

const composer=document.querySelector('.composer');
const messagesView=document.querySelector('.chat-messages');
const errorView=document.querySelector('.chat-error');
const history=[];
let busy=false;
let configured=false;
function appendMessage(role,text){
 const bubble=document.createElement('div');bubble.className='chat-bubble '+(role==='model'?'assistant':role);bubble.textContent=text;
 messagesView.append(bubble);messagesView.scrollTop=messagesView.scrollHeight;return bubble;
}
composer.dataset.model='Dua';
modelPicker.querySelectorAll('input[name="chat-model"]').forEach(input=>{if(!['Dua','Gemini'].includes(input.value))input.disabled=true;});
async function loadConfiguration(){
 const footer=document.querySelector('.model-sheet-footer');
 if(location.protocol==='file:'){footer.textContent='AI replies ke liye Dua server par chat kholein.';return;}
 try{
  const response=await fetch('/api/config');if(!response.ok)throw new Error();
  const data=await response.json();configured=data.geminiConfigured;
  footer.textContent=configured?'Dua and Gemini available · Other models coming soon':'Gemini API key abhi server par set nahi hai.';
 }catch(e){footer.textContent='Gemini server se connection nahi hua.';}
}
loadConfiguration();
composer.addEventListener('submit',async event=>{
 event.preventDefault();
 const text=message.value.trim();if(!text||busy)return;
 busy=true;message.disabled=true;action.setAttribute('aria-disabled','true');
 let userBubble,pending;
 try{
  errorView.textContent='';
  if(!configured){await loadConfiguration();if(!configured){errorView.textContent=location.protocol==='file:'?'AI chat ke liye http://localhost:3000 kholein.':'Gemini API key aur model server settings mein set karein.';return;}}
  if(text.length>8000){errorView.textContent='Message 8000 characters se chhota rakhein.';return;}
  document.querySelector('.empty').hidden=true;
  userBubble=appendMessage('user',text);pending=appendMessage('model','Dua is thinking…');
  const nextHistory=[...history.slice(-38),{role:'user',text}];
  const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:composer.dataset.model,messages:nextHistory})});
  const data=await response.json();if(!response.ok)throw new Error(data.error||'Reply nahi aa saka.');
  pending.textContent=data.text;history.push({role:'user',text},{role:'model',text:data.text});
  message.value='';
 }catch(e){pending?.remove();userBubble?.remove();errorView.textContent=e.message;}
 finally{busy=false;message.disabled=false;action.removeAttribute('aria-disabled');updateAction();messagesView.scrollTop=messagesView.scrollHeight;message.focus();if(!history.length)document.querySelector('.empty').hidden=Boolean(errorView.textContent);}
});
message.addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();composer.requestSubmit();}});
</script>
</body>
</html>
