<body>
<main class="screen" aria-label="New chat interface">

<button class="round" aria-label="Desktop view"><svg viewBox="0 0 32 32"><rect x="6" y="5" width="20" height="17" rx="1"/><path d="M16 22v5M10 27h12"/></svg></button>

<span class="chat-header-title">I am Dua</span></nav>

<section class="chat-messages" aria-label="Conversation" aria-live="polite"></section><p class="chat-error" role="status"></p><form class="composer"><textarea aria-label="Message" placeholder="Ask anything..." rows="1"></textarea><div class="controls"><div class="control-group"><a class="round" aria-label="Add to chat" id="attach" href="add-to-chat.html"><svg viewBox="0 0 40 40"><path d="M20 7v26M7 20h26"/></svg></a><input type="file" id="file" hidden><details class="model-picker"><summary class="model" aria-label="Choose a model"><span class="model-chip-label">Model</span><span class="model-close-label">Done</span></summary><div class="model-backdrop" aria-hidden="true"></div><section class="model-sheet" aria-labelledby="model-sheet-title"><div class="sheet-handle" aria-hidden="true"></div><header class="model-sheet-header"><h2 id="model-sheet-title">Choose a model</h2><p>Pick who responds in this chat</p></header><fieldset class="model-options"><legend class="voice-status">Available models</legend><label class="model-option"><input type="radio" name="chat-model" value="Dua" checked><span class="provider-icon" aria-hidden="true">D</span><span class="model-option-copy"><span class="model-option-name">Dua</span><span class="model-option-description">Default · Gemini</span></span><span class="model-check" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="m5 10 3 3 7-7"/></svg></span></label><label class="model-option"><input type="radio" name="chat-model" value="GPT"><span class="provider-icon" aria-hidden="true">G</span><span class="model-option-copy"><span class="model-option-name">GPT</span><span class="model-option-description">OpenAI · Placeholder</span></span><span class="model-check" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="m5 10 3 3 7-7"/></svg></span></label><label class="model-option"><input type="radio" name="chat-model" value="Gemini"><span class="provider-icon" aria-hidden="true">✦</span><span class="model-option-copy"><span class="model-option-name">Gemini</span><span class="model-option-description">Google · Gemini</span></span><span class="model-check" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="m5 10 3 3 7-7"/></svg></span></label><label class="model-option"><input type="radio" name="chat-model" value="Claude"><span class="provider-icon" aria-hidden="true">C</span><span class="model-option-copy"><span class="model-option-name">Claude</span><span class="model-option-description">Anthropic · Placeholder</span></span><span class="model-check" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="m5 10 3 3 7-7"/></svg></span></label><label class="model-option"><input type="radio" name="chat-model" value="Grok"><span class="provider-icon" aria-hidden="true">X</span><span class="model-option-copy"><span class="model-option-name">Grok</span><span class="model-option-description">xAI · Placeholder</span></span><span class="model-check" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="m5 10 3 3 7-7"/></svg></span></label><label class="model-option"><input type="radio" name="chat-model" value="Kimi"><span class="provider-icon" aria-hidden="true">K</span><span class="model-option-copy"><span class="model-option-name">Kimi</span><span class="model-option-description">Moonshot · Placeholder</span></span><span class="model-check" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="m5 10 3 3 7-7"/></svg></span></label></fieldset><footer class="model-sheet-footer">Gemini configuration check ho rahi hai…</footer></section></details></div><div class="control-group"><a class="round mic" aria-label="Open voice mode" href="voice.html"><svg viewBox="0 0 40 48" stroke="white" stroke-width="2.5" fill="none"><rect x="11" y="4" width="18" height="32" rx="9" fill="white" stroke="none"/><path d="M6 23v3a14 14 0 0 0 28 0v-3M20 40v7M9 47h22"/></svg></a><a class="round send voice-ready" aria-label="Start voice mode" id="composer-action" href="voice.html"><img class="action-cube" src="dua-cube.svg" alt=""><svg class="action-arrow" hidden viewBox="0 0 40 40"><path d="M20 33V7M9 18 20 7l11 11"/></svg></a></div></div></form>

<script>
const message = document.querySelector('textarea');
const action = document.querySelector('#composer-action');
const cube = action.querySelector('.action-cube');
const arrow = action.querySelector('.action-arrow');
const status = document.querySelector('#voice-status');
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let listening = false;
function updateAction() {
  const hasText = message.value.trim().length > 0;
  cube.hidden = hasText;
  arrow.toggleAttribute('hidden', !hasText);
  action.classList.toggle('voice-ready', !hasText);
  action.classList.toggle('listening', listening);
  const label = hasText ? 'Send message' : listening ? 'Stop voice mode' : 'Start voice mode';
  action.setAttribute('aria-label', label);
  action.title = label;
}
function stopVoice() {
  if (recognition) recognition.stop();
  listening = false;
  updateAction();
}
function startVoice() { window.location.href = 'voice.html'; }
message.addEventListener('input', () => {
  if (listening) stopVoice();
  updateAction();
});
action.addEventListener('click', (event) => {
  if (!message.value.trim()) return;
  event.preventDefault();
  stopVoice();
  document.querySelector('.composer').requestSubmit();
});


updateAction();

const modelPicker = document.querySelector('.model-picker');
const modelSummary = modelPicker.querySelector('summary');
function closeModelPicker(){modelPicker.open=false;modelSummary.focus();}
modelPicker.querySelector('.model-backdrop').addEventListener('click',closeModelPicker);
modelPicker.addEventListener('toggle',()=>{if(modelPicker.open)stopVoice();});
modelPicker.querySelectorAll('input[name="chat-model"]').forEach(input=>input.addEventListener('change',()=>{
  document.querySelector('.model-chip-label').textContent=input.value;
  document.querySelector('.composer').dataset.model=input.value;
}));
document.addEventListener('keydown',event=>{
  if(!modelPicker.open)return;
  if(event.key==='Escape')closeModelPicker();
  if(event.key==='Tab'){
    const selected=modelPicker.querySelector('input:checked');
    if(document.activeElement===modelSummary){event.preventDefault();selected.focus();}
    else if(document.activeElement.name==='chat-model'){event.preventDefault();modelSummary.focus();}
  }
});

const composer=document.querySelector('.composer');
const messagesView=document.querySelector('.chat-messages');
const errorView=document.querySelector('.chat-error');
const history=[];
let busy=false;
let configured=false;
function appendMessage(role,text){
 const bubble=document.createElement('div');bubble.className='chat-bubble '+(role==='model'?'assistant':role);bubble.textContent=text;
 messagesView.append(bubble);messagesView.scrollTop=messagesView.scrollHeight;return bubble;
}
composer.dataset.model='Dua';
modelPicker.querySelectorAll('input[name="chat-model"]').forEach(input=>{if(!['Dua','Gemini'].includes(input.value))input.disabled=true;});
async function loadConfiguration(){
 const footer=document.querySelector('.model-sheet-footer');
 if(location.protocol==='file:'){footer.textContent='AI replies ke liye Dua server par chat kholein.';return;}
 try{
  const response=await fetch('/api/config');if(!response.ok)throw new Error();
  const data=await response.json();configured=data.geminiConfigured;
  footer.textContent=configured?'Dua and Gemini available · Other models coming soon':'Gemini API key abhi server par set nahi hai.';
 }catch(e){footer.textContent='Gemini server se connection nahi hua.';}
}
loadConfiguration();
composer.addEventListener('submit',async event=>{
 event.preventDefault();
 const text=message.value.trim();if(!text||busy)return;
 errorView.textContent='';
 if(!configured){await loadConfiguration();if(!configured){errorView.textContent=location.protocol==='file:'?'AI chat ke liye http://localhost:3000 kholein.':'Gemini API key server settings mein set karein.';return;}}
 if(text.length>8000){errorView.textContent='Message 8000 characters se chhota rakhein.';return;}
 busy=true;message.disabled=true;action.setAttribute('aria-disabled','true');
 document.querySelector('.empty').hidden=true;
 const userBubble=appendMessage('user',text);const pending=appendMessage('model','Dua is thinking…');
 const nextHistory=[...history.slice(-38),{role:'user',text}];
 try{
  const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:composer.dataset.model,messages:nextHistory})});
  const data=await response.json();if(!response.ok)throw new Error(data.error||'Reply nahi aa saka.');
  pending.textContent=data.text;history.push({role:'user',text},{role:'model',text:data.text});
  message.value='';
 }catch(e){pending.remove();userBubble.remove();errorView.textContent=e.message;}
 finally{busy=false;message.disabled=false;action.removeAttribute('aria-disabled');updateAction();messagesView.scrollTop=messagesView.scrollHeight;message.focus();if(!history.length)document.querySelector('.empty').hidden=false;}
});
message.addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();composer.requestSubmit();}});
</script>
</body>
</html>
