<body><main class="chat-list-view home-screen" aria-label="Home"><header class="chat-list-header"><a class="round" id="show-profile-settings" aria-label="Settings menu" href="settings.html"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></a><div class="chat-list-actions"><button type="button" class="round" id="search-chats" aria-label="Search chats"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/></svg></button><a class="round" id="sidebar-new-chat" aria-label="New chat" href="chat.html"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18"/></svg></a></div></header><div class="chat-search" hidden><input type="search" id="chat-search-input" aria-label="Search conversations" placeholder="Search chats"></div><a class="conversation-row" id="dua-conversation" href="chat.html"><img src="dua-cube.svg" alt=""><span class="conversation-copy"><span class="conversation-title">I am Dua</span><span class="conversation-preview">Ask anything...</span></span><span class="conversation-time">Yesterday</span></a></main><script>const search=document.querySelector('.chat-search');const input=document.querySelector('#chat-search-input');const conversation=document.querySelector('#dua-conversation');document.querySelector('#search-chats').addEventListener('click',()=>{search.hidden=!search.hidden;if(!search.hidden)input.focus();else{input.value='';conversation.hidden=false}});input.addEventListener('input',()=>{conversation.hidden=!'I am Dua'.toLowerCase().includes(input.value.trim().toLowerCase())});</script></body></html>
