<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0a0a">
<title>I am Dua</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23333333' stroke='%23aaaaaa' d='M16 2 30 10v15L16 32 2 25V10Z M2 10l14 8 14-8 M16 18v14'/%3E%3C/svg%3E">
<link rel="stylesheet" href="shared.css">
<style>.conversation-copy{min-width:0}.conversation-title{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.history-warning{color:#ffb1c0;font-size:14px;margin:16px}.search-empty{padding:64px 16px;text-align:center}.search-empty h2{font-size:22px;font-weight:400;margin:0 0 12px}.search-empty p{color:var(--on-surface-variant);font-size:14px;line-height:1.5;margin:0 0 24px}.search-clear{min-height:48px;padding:12px 24px;border:0;border-radius:24px;background:var(--secondary-container);color:var(--on-surface);font-size:14px}.history-empty{text-align:center;padding:64px 16px}.history-empty h2{font-size:24px;font-weight:400}.history-empty p{font-size:16px;color:var(--on-surface-variant);line-height:1.5}.history-empty a{display:inline-flex;min-height:48px;align-items:center;padding:12px 24px;border-radius:24px;background:var(--primary);color:var(--on-primary);margin-top:16px}.conversation-preview{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:65vw}.history-empty[hidden],.conversation-row[hidden]{display:none!important}</style>
</head>
<body><main class="chat-list-view home-screen" aria-label="Home"><header class="chat-list-header"><a class="round" id="show-profile-settings" aria-label="Settings menu" href="settings.html"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></a><div class="chat-list-actions"><button type="button" class="round" id="search-chats" aria-label="Search chats"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/></svg></button><a class="round" id="sidebar-new-chat" aria-label="New chat" href="chat.html?new=1"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18"/></svg></a></div></header><div class="chat-search" hidden><input type="search" id="chat-search-input" aria-label="Search conversations" placeholder="Search chats"></div><div id="saved-chats"></div><p class="history-warning" role="status"></p><section class="search-empty" hidden role="status" aria-live="polite"><h2>No chats found</h2><p>Try another word or clear your search.</p><button type="button" class="search-clear">Clear search</button></section><section class="history-empty" hidden><h2>I am Dua</h2><p>Your conversations will appear here.</p><a href="chat.html?new=1">New chat</a></section></main><script src="chat-history.js"></script><script>
const search=document.querySelector('.chat-search'),input=document.querySelector('#chat-search-input'),empty=document.querySelector('.search-empty'),historyEmpty=document.querySelector('.history-empty'),list=document.querySelector('#saved-chats');let chats=[];
function loadChats(){try{chats=DuaHistory.list();filterChats()}catch{document.querySelector('.history-warning').textContent='Saved chats could not be loaded. Stored data has been preserved.';}}
function filterChats(){
 const query=input.value.trim().toLowerCase();list.replaceChildren();let matches=0;
 for(const chat of chats){
  const title=chat.messages.find(m=>m.role==='user')?.text.slice(0,60)||'Draft';
  const preview=chat.draft.trim()?'Draft: '+chat.draft:chat.messages.at(-1)?.text||'';
  if(!(title+' '+preview).toLowerCase().includes(query))continue;matches++;
  const row=document.createElement('div');row.style.cssText='display:flex;align-items:center';
  const link=document.createElement('a');link.className='conversation-row';link.href='chat.html?chat='+encodeURIComponent(chat.id);link.style.cssText='flex:1;min-width:0';
  const icon=document.createElement('img');icon.src='dua-cube.svg';icon.alt='';
  const copy=document.createElement('span');copy.className='conversation-copy';
  const heading=document.createElement('span');heading.className='conversation-title';heading.textContent=title;
  const text=document.createElement('span');text.className='conversation-preview';text.textContent=preview;
  copy.append(heading,text);link.append(icon,copy);
  const remove=document.createElement('button');remove.type='button';remove.className='round';remove.textContent='×';remove.setAttribute('aria-label','Delete chat: '+title);
  remove.onclick=()=>{if(!confirm('Delete this chat from this device?'))return;try{DuaHistory.remove(chat.id);loadChats()}catch{document.querySelector('.history-warning').textContent='Chat could not be deleted.';}};
  row.append(link,remove);list.append(row);
 }
 empty.hidden=!query||matches>0;historyEmpty.hidden=chats.length>0||!!query;
}
document.querySelector('#search-chats').onclick=()=>{search.hidden=!search.hidden;if(!search.hidden)input.focus();else input.value='';filterChats()};input.oninput=filterChats;document.querySelector('.search-clear').onclick=()=>{input.value='';filterChats();input.focus()};window.addEventListener('pageshow',loadChats);window.addEventListener('storage',loadChats);loadChats();
</script></body></html>
