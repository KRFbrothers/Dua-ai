<body><main class="profile-settings-view standalone-settings" aria-label="Settings"><header class="settings-header"><a class="round" id="back-to-chats" aria-label="Back to home" href="index.html"><svg viewBox="0 0 24 24"><path d="m14 5-7 7 7 7M7 12h14"/></svg></a><h2 id="settings-title">Settings</h2><svg class="info-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 11v6M12 7h.01"/></svg></header><div class="settings-content"><section class="settings-group" aria-label="Profile settings"><a href="profile.html" class="setting-row"><svg class="setting-icon" viewBox="0 0 28 28" aria-hidden="true"><g xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#FFFFFF" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="6" /><path d="M2 25c0-7 20-7 20 0z" /></g></svg><div class="setting-copy"><span class="setting-label">Profile</span><span class="setting-description">Dua AI account</span></div><svg class="setting-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></a><a href="computer-mode.html" class="setting-row"><svg class="setting-icon" viewBox="0 0 28 28" aria-hidden="true"><g xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#FFFFFF" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="22" height="16" rx="1" /><path d="M13 20v4M7 24h12" /></g></svg><div class="setting-copy"><span class="setting-label">Computer mode</span><span class="setting-description">Coming soon</span></div><svg class="setting-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></a></section><section class="settings-group" aria-label="Data controls settings"><a href="data-controls.html" class="setting-row"><svg class="setting-icon" viewBox="0 0 28 28" aria-hidden="true"><g xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#FFFFFF" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="13" cy="5" rx="10" ry="4" /><path d="M3 5v18c0 5 20 5 20 0V5M3 12c0 5 20 5 20 0M3 19c0 5 20 5 20 0" /></g></svg><div class="setting-copy"><span class="setting-label">Data controls</span></div><svg class="setting-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></a></section><section class="settings-group" aria-label="Capabilities settings"><a href="integrations.html" class="setting-row"><svg class="setting-icon" viewBox="0 0 28 28" aria-hidden="true"><g xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#FFFFFF" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6h22M2 13h22M2 20h22" /><circle cx="10" cy="6" r="3" fill="#171717" /><circle cx="18" cy="13" r="3" fill="#171717" /><circle cx="9" cy="20" r="3" fill="#171717" /></g></svg><div class="setting-copy"><span class="setting-label">Capabilities</span><span class="setting-description">Feature setup</span></div><svg class="setting-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></a><a href="integrations.html" class="setting-row"><svg class="setting-icon" viewBox="0 0 28 28" aria-hidden="true"><g xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#FFFFFF" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2h7v5a3 3 0 1 1 4 4h4v7h-4a3 3 0 1 1-4 4v3h-7v-4a3 3 0 1 1-4-4H2v-7h4a3 3 0 1 1 4-4z" /></g></svg><div class="setting-copy"><span class="setting-label">Plugins</span><span class="setting-description">Connection setup</span></div><svg class="setting-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></a><a href="permissions.html" class="setting-row"><svg class="setting-icon" viewBox="0 0 28 28" aria-hidden="true"><g xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#FFFFFF" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"><path d="M5 18a8 8 0 0 1 16 0v6H5zM7 6 4 3m15 3 3-3M10 14h.01M16 14h.01" /></g></svg><div class="setting-copy"><span class="setting-label">Permissions</span></div><svg class="setting-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></a></section><section class="settings-group" aria-label="Color mode settings"><a href="color-mode.html" class="setting-row"><svg class="setting-icon" viewBox="0 0 28 28" aria-hidden="true"><g xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#FFFFFF" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"><path d="M21 21A11 11 0 0 1 9 3a10 10 0 1 0 12 18z" /></g></svg><div class="setting-copy"><span class="setting-label">Color mode</span><span class="setting-description">Dark</span></div><svg class="setting-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></a><a href="font-style.html" class="setting-row"><span class="setting-icon font-icon" aria-hidden="true">Aa</span><div class="setting-copy"><span class="setting-label">Font style</span><span class="setting-description">Default</span></div><svg class="setting-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></a><a href="voice.html" class="setting-row"><svg class="setting-icon" viewBox="0 0 28 28" aria-hidden="true"><g xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#FFFFFF" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13v5m5-12v17m5-21v25m5-19v13m5-8v5" /></g></svg><div class="setting-copy"><span class="setting-label">Voice</span><span class="setting-description">Speech and read aloud</span></div><svg class="setting-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></a></section><section class="settings-group" aria-label="Haptic feedback settings"><div class="setting-row"><svg class="setting-icon" viewBox="0 0 28 28" aria-hidden="true"><g xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#FFFFFF" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="14" height="20" rx="2" /><path d="M2 8 0 10m2 10-2-2m24-10 2 2m-2 10 2-2M11 21h4" /></g></svg><div class="setting-copy"><span class="setting-label">Haptic feedback</span></div><button type="button" class="m3-switch" role="switch" aria-checked="false" aria-label="Haptic feedback" id="haptic-toggle"><span></span></button></div><a href="notifications.html" class="setting-row"><svg class="setting-icon" viewBox="0 0 28 28" aria-hidden="true"><g xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#FFFFFF" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h20c-3-3-4-6-4-10a7 7 0 0 0-14 0c0 4-1 7-2 10zM11 23a2 2 0 0 0 4 0" /></g></svg><div class="setting-copy"><span class="setting-label">Notifications</span></div><svg class="setting-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></a><a href="privacy.html" class="setting-row"><svg class="setting-icon" viewBox="0 0 28 28" aria-hidden="true"><g xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#FFFFFF" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 24 6v8c0 7-5 11-11 13C7 25 2 21 2 14V6z" /></g></svg><div class="setting-copy"><span class="setting-label">Privacy</span></div><svg class="setting-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></a><a href="sharing.html" class="setting-row"><svg class="setting-icon" viewBox="0 0 28 28" aria-hidden="true"><g xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#FFFFFF" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10H3v15h20V10h-3M13 18V2m0 0-5 5m5-5 5 5" /></g></svg><div class="setting-copy"><span class="setting-label">Sharing</span></div><svg class="setting-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></a></section><section class="settings-group" aria-label="Log out settings"><a href="logout.html" class="setting-row logout-row"><svg class="setting-icon" viewBox="0 0 28 28" aria-hidden="true"><g xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#DD6680" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3H4v22h9M14 14h12m0 0-5-5m5 5-5 5" /></g></svg><div class="setting-copy"><span class="setting-label">Log out</span></div><svg class="setting-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></a></section><a href="memory.html" class="setting-row"><div class="setting-copy"><span class="setting-label">Memory</span><span class="setting-description">Local · Opt in</span></div></a></div></main><script>
const origin=new URLSearchParams(location.search).get('from');
const back=document.querySelector('#back-to-chats');
if(origin==='voice'){back.href='voice.html';back.setAttribute('aria-label','Back to Voice');}
const toggle=document.querySelector('#haptic-toggle');try{toggle.setAttribute('aria-checked',String(DuaPreferences.read().haptic));}catch{}toggle.addEventListener('click',()=>{const enabled=toggle.getAttribute('aria-checked')!=='true';try{DuaPreferences.update({haptic:enabled});}catch{toggle.title='Haptic setting could not be saved';return;}toggle.setAttribute('aria-checked',String(enabled));});</script><script>
// Preserve the Settings entry route through its nested design screens.
if(new URLSearchParams(location.search).get('from')==='voice'){
 document.querySelectorAll('a[href]').forEach(link=>{const target=link.getAttribute('href');if(['settings.html', 'profile.html', 'data-controls.html', 'permissions.html', 'color-mode.html', 'font-style.html', 'notifications.html', 'logout.html', 'computer-mode.html', 'voice-permission.html', 'voice-permission-denied.html','memory.html','privacy.html','sharing.html'].includes(target)){link.setAttribute('href',target+'?from=voice');}});
}
</script><script>
const computerLink=Array.from(document.querySelectorAll('a[href]')).find(a=>a.getAttribute('href').split('?')[0]==='computer-mode.html');
if(computerLink)computerLink.href='computer-mode.html?source=settings'+(new URLSearchParams(location.search).get('from')==='voice'?'&from=voice':'');
</script><script>
try{const preferences=DuaPreferences.read();for(const [href,value] of [['color-mode.html',preferences.theme],['font-style.html',preferences.font]]){const label=document.querySelector('a[href^="'+href+'"] .setting-description');if(label)label.textContent=value.replace(/^./,c=>c.toUpperCase());}}catch{}
</script></body></html>
