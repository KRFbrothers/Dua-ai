name: Project checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  google-cloud:
    name: Google Cloud engine tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install isolated test dependencies
        run: |
          python3 -m venv /tmp/dua-gcb-tests
          /tmp/dua-gcb-tests/bin/python -m pip install Flask==3.0.3 pytest==8.3.5
      - name: Run mocked Vertex engine tests
        run: /tmp/dua-gcb-tests/bin/python -m pytest -q google-cloud-backend/tests --junitxml=google-cloud-backend/pytest-results.xml
      - name: Preserve engine test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: google-cloud-engine-test-report
          path: google-cloud-backend/pytest-results.xml
          if-no-files-found: ignore

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked backend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run backend tests
        run: npm run test:ci
      - name: Preserve backend test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-unit-test-report
          path: web/backend-test-results.xml
          if-no-files-found: ignore

  website:
    name: Website build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install locked website dependencies
        run: npm ci --no-audit --no-fund
      - name: Type-check and build the website
        run: npm run build
      - name: Check the build output dua-api serves
        run: test -s ../web/site/index.html && test -s ../web/site/dua-logo.webp

  android:
    name: Android build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Compile Android sources and run unit tests
        run: bash ./gradlew :app:testDebugUnitTest -Pdua.ui-record --no-daemon --max-workers=2
      - name: Preserve unit test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/approved-ui/
          if-no-files-found: ignore
