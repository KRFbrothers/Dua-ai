name: Project checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  google-cloud:
    name: Google Cloud engine tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      adk-postgres:
        image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_PASSWORD: adk-ci-disposable-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install isolated test dependencies
        run: |
          python3 -m venv /tmp/dua-gcb-tests
          /tmp/dua-gcb-tests/bin/python -m pip install Flask==3.0.3 pytest==8.3.5
      - name: Run mocked Vertex engine tests
        run: /tmp/dua-gcb-tests/bin/python -m pytest -q apps/ai-engine/tests --junitxml=apps/ai-engine/pytest-results.xml
      - name: Install production SDK test dependencies
        run: |
          python3 -m venv /tmp/dua-gcb-adk-tests
          /tmp/dua-gcb-adk-tests/bin/python -m pip install -r apps/ai-engine/requirements-adapters-lock.txt pytest==8.3.5
      - name: Run engine tests with the real ADK SDK and offline models
        env:
          ADK_TEST_POSTGRES_URL: postgresql://postgres:adk-ci-disposable-only@127.0.0.1:5432/postgres
        run: |
          /tmp/dua-gcb-adk-tests/bin/python -c "import google.adk, google.genai, asyncpg, psycopg, pgvector, litellm"
          /tmp/dua-gcb-adk-tests/bin/python -m pytest -q apps/ai-engine/tests --junitxml=apps/ai-engine/pytest-sdk-results.xml
      - name: Preserve engine test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: google-cloud-engine-test-report
          path: |
            apps/ai-engine/pytest-results.xml
            apps/ai-engine/pytest-sdk-results.xml
          if-no-files-found: ignore

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install locked backend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run backend tests
        run: npm run test:ci
      - name: Preserve backend test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-unit-test-report
          path: apps/api/backend-test-results.xml
          if-no-files-found: ignore

  website:
    name: Website build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked website dependencies
        run: npm ci --no-audit --no-fund
      - name: Type-check and build the website
        run: npm run build
      - name: Check the build output dua-api serves
        run: test -s ../api/site/index.html && test -s ../api/site/dua-logo.webp

  android:
    name: Android build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Compile Android sources and run unit tests
        working-directory: apps/android
        run: bash ./gradlew :app:testDebugUnitTest -Pdua.ui-record --no-daemon --max-workers=2
      - name: Preserve unit test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-unit-test-reports
          path: |
            apps/android/app/build/reports/tests/testDebugUnitTest/
            apps/android/app/build/test-results/testDebugUnitTest/
            apps/android/app/build/approved-ui/
          if-no-files-found: ignore
