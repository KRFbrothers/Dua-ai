name: Build personal APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-apk
  cancel-in-progress: false

jobs:
  release:
    # Signing credentials are only consumed by an explicitly requested main-branch build.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Restore permanent keystore, verify certificate, and build
        shell: bash
        env:
          DUA_RELEASE_KEYSTORE_BASE64: ${{ secrets.DUA_RELEASE_KEYSTORE_BASE64 }}
          DUA_RELEASE_STORE_PASSWORD: ${{ secrets.DUA_RELEASE_STORE_PASSWORD }}
          DUA_RELEASE_KEY_ALIAS: ${{ secrets.DUA_RELEASE_KEY_ALIAS }}
          DUA_RELEASE_KEY_PASSWORD: ${{ secrets.DUA_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for name in DUA_RELEASE_KEYSTORE_BASE64 DUA_RELEASE_STORE_PASSWORD DUA_RELEASE_KEY_ALIAS DUA_RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing Actions secret: $name. Restore the permanent key; do not create another key."
              exit 1
            fi
          done
          export DUA_RELEASE_STORE_FILE="$RUNNER_TEMP/dua-owner.jks"
          trap 'rm -f "$DUA_RELEASE_STORE_FILE"' EXIT
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          Path(os.environ['DUA_RELEASE_STORE_FILE']).write_bytes(
              base64.b64decode(os.environ['DUA_RELEASE_KEYSTORE_BASE64'], validate=True)
          )
          PY
          unset DUA_RELEASE_KEYSTORE_BASE64
          bash ./gradlew :app:assembleRelease --no-daemon --max-workers=2
      - name: Verify installable APK and create download metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p personal-apk
          cp app/build/outputs/apk/release/app-release.apk personal-apk/Dua-AI.apk
          python3 tooling/scripts/verify-apk-signature.py \
            --apk personal-apk/Dua-AI.apk \
            --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            --output-dir personal-apk
      - name: Preserve APK download
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Dua-personal-APK
          path: personal-apk/
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK download in repository Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/dua-release-notes.md" <<EOF
          Personal Android APK from commit $GITHUB_SHA.
          Signed with the pinned permanent owner certificate; checksums and public fingerprints are attached.
          Repository build verification only; Google sign-in still requires matching Google/Supabase configuration and a device check.
          EOF
          release_url=$(gh release create "personal-apk-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Dua personal APK — build ${GITHUB_RUN_NUMBER}" \
            --notes-file "$RUNNER_TEMP/dua-release-notes.md" \
            personal-apk/Dua-AI.apk personal-apk/SHA256SUMS personal-apk/signing-certificate.txt)
          echo "APK download: $release_url" >> "$GITHUB_STEP_SUMMARY"
