name: Google agent checks

on:
  pull_request:
    paths:
      - 'google-agent/**'
      - '.github/workflows/agent-checks.yml'
  push:
    branches: [main]
    paths:
      - 'google-agent/**'
      - '.github/workflows/agent-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent:
    name: Agent policy and orchestration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned agent SDK
        working-directory: google-agent
        run: python -m pip install -r requirements.txt
      - name: Run mocked policy and orchestration tests
        working-directory: google-agent
        run: python -m unittest discover -s tests -v
